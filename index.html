<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시험 응시율 계산 및 보고서 생성기</title>
    <!-- 세련된 폰트 (Pretendard) 적용 -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <!-- html2canvas 및 jsPDF 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Pretendard', 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 20px 10px;
            color: #334155;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .input-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .card-title {
            font-size: 1.2em;
            font-weight: 700;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 20px;
            background-color: #4f46e5;
            border-radius: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.85em;
            color: #64748b;
        }
        input, select {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95em;
            transition: all 0.2s ease;
            font-family: inherit;
            background-color: #f8fafc;
            color: #1e293b;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #4f46e5;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-actions {
            margin-top: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-direction: column;
        }
        @media (min-width: 600px) {
            .form-actions { flex-direction: row; }
        }
        .form-actions button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-add {
            background-color: #4f46e5;
            color: white;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }
        .btn-add:hover { background-color: #4338ca; transform: translateY(-2px); }
        
        .btn-template {
            background-color: #f59e0b;
            color: white;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.2);
        }
        .btn-template:hover { background-color: #d97706; transform: translateY(-2px); }

        .utility-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px dashed #cbd5e1;
            flex-wrap: wrap;
            gap: 10px;
        }
        .utility-actions-left, .utility-actions-right {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .utility-actions button {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.85em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        /* 기존 버튼 색상 유지 */
        .btn-save { background-color: #0d9488; color: white; }
        .btn-save:hover { background-color: #0f766e; }
        .btn-load { background-color: #0284c7; color: white; }
        .btn-load:hover { background-color: #0369a1; }
        .btn-reset { background-color: #f1f5f9; color: #475569; }
        .btn-reset:hover { background-color: #e2e8f0; color: #1e293b; }
        
        /* 엑셀 관련 버튼 색상 */
        .btn-excel-dl { background-color: #16a34a; color: white; }
        .btn-excel-dl:hover { background-color: #15803d; }
        .btn-excel-ul { background-color: #2563eb; color: white; }
        .btn-excel-ul:hover { background-color: #1d4ed8; }

        .export-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-direction: column;
        }
        @media (min-width: 600px) {
            .export-actions { flex-direction: row; }
        }
        .export-actions button {
            flex: 1;
            font-size: 1em;
            padding: 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        
        .btn-export-img {
            background-color: #10b981;
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .btn-export-img:hover { background-color: #059669; transform: translateY(-2px); }

        .btn-export-pdf {
            background-color: #ef4444;
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }
        .btn-export-pdf:hover { background-color: #dc2626; transform: translateY(-2px); }
        
        /* 보고서 영역 래퍼 */
        .report-wrapper {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            margin: 0 auto;
        }

        .report-container {
            box-sizing: border-box; 
            padding: 40px;
            width: 1122px; /* A4 가로 비율 */
            min-width: 1122px; 
            background: #ffffff; 
        }

        .report-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            gap: 12px; 
        }
        .report-header-left { width: 100%; }
        .report-header-left h2 {
            margin: 0;
            color: #0f172a;
            font-size: 1.8em;
            font-weight: 800;
            letter-spacing: -0.5px;
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .report-header-right {
            width: 100%;
            text-align: right;
        }
        .report-header-right .subtitle {
            color: #64748b;
            font-size: 1.05em;
            font-weight: 500;
        }
        
        .table-responsive {
            width: 100%;
            overflow: visible; 
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
            max-width: 100%;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px 6px; 
            text-align: center;
            vertical-align: middle;
            white-space: nowrap; 
        }
        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 700;
            white-space: pre-wrap; 
            line-height: 1.4;
        }
        th.border-left-strong, td.border-left-strong {
            border-left: 2px solid #cbd5e1;
        }
        tbody tr { transition: background-color 0.15s ease; }
        tbody tr:hover { background-color: #f8fafc; }
        .rate-cell { font-weight: 700; color: #4f46e5; }
        .absent-cell { color: #94a3b8; }
        .total-row {
            background-color: #f1f5f9 !important;
            font-weight: 700;
            color: #0f172a;
        }
        .total-row td { border-top: 2px solid #cbd5e1; }
        .total-row .rate-cell { color: #ea580c; }
        
        .placeholder-text {
            text-align: center;
            color: #94a3b8;
            padding: 60px 0;
            font-weight: 500;
            white-space: normal;
        }

        .btn-delete {
            padding: 6px 10px;
            background-color: #fef2f2;
            color: #ef4444;
            border: 1px solid #fecaca;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background-color: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="input-card">
        <div class="card-title">정보 입력</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="agency">기관명</label>
                <input type="text" id="agency" placeholder="예: OO기관" value="">
            </div>
            <div class="form-group">
                <label for="exam">시험명</label>
                <input type="text" id="exam" placeholder="예: 필기전형" value="">
            </div>
            <div class="form-group">
                <label for="examDate">전형(시험)일</label>
                <input type="date" id="examDate">
            </div>
            <div class="form-group">
                <label for="room">고사실 (시험실)</label>
                <input type="text" id="room" placeholder="예: 1고사실">
            </div>
            <div class="form-group">
                <label for="field">지원분야</label>
                <input type="text" id="field" placeholder="예: 일반직">
            </div>
            <div class="form-group">
                <label for="period">교시</label>
                <select id="period">
                    <option value="1교시">1교시</option>
                    <option value="2교시">2교시</option>
                    <option value="3교시">3교시</option>
                </select>
            </div>
            <div class="form-group">
                <label for="subject">과목</label>
                <input type="text" id="subject" placeholder="예: 인성검사">
            </div>
            <div class="form-group">
                <label for="total">총 인원 (배정)</label>
                <input type="number" id="total" min="0" placeholder="0">
            </div>
            <div class="form-group">
                <label for="attendees">응시인원</label>
                <input type="number" id="attendees" min="0" placeholder="0">
            </div>
        </div>
        
        <div class="form-actions">
            <button class="btn-add" onclick="calculateAndAdd(false)">➕ 데이터 추가 및 계산</button>
            <button class="btn-template" onclick="calculateAndAdd(true)">📄 현장 수기용 템플릿 생성</button>
        </div>
        
        <div class="utility-actions">
            <div class="utility-actions-left">
                <!-- 엑셀 관련 버튼 추가 -->
                <button class="btn-excel-dl" onclick="downloadCSVTemplate()">📥 엑셀 양식 다운로드</button>
                <button class="btn-excel-ul" onclick="triggerExcelUpload()">📤 엑셀(CSV) 일괄 등록</button>
                <button class="btn-save" onclick="saveDataToFile()">💾 백업용 파일 저장</button>
                <button class="btn-load" onclick="triggerLoadFile()">📂 파일 불러오기</button>
            </div>
            <div class="utility-actions-right">
                <button class="btn-reset" onclick="resetData()">🗑️ 전체 초기화</button>
            </div>
        </div>
        
        <!-- 파일 입력을 위한 숨겨진 인풋들 -->
        <input type="file" id="file-input" accept=".json" style="display: none;" onchange="loadDataFromFile(event)">
        <!-- 엑셀 처리를 위해 순수 브라우저에서 다루기 쉬운 CSV 확장자를 사용합니다 -->
        <input type="file" id="excel-input" accept=".csv" style="display: none;" onchange="loadFromCSV(event)">
    </div>

    <!-- 캡처 대상 컨테이너 래퍼 (스크롤 영역) -->
    <div class="report-wrapper">
        <!-- 실제 캡처될 고정 크기 컨테이너 -->
        <div id="report-area" class="report-container">
            <div class="report-header">
                <div class="report-header-left">
                    <h2 id="report-title">기관명 [시험명]</h2>
                </div>
                <div class="report-header-right">
                    <span class="subtitle" id="report-subtitle">데이터를 입력하면 날짜가 반영됩니다.</span>
                </div>
            </div>
            
            <div class="table-responsive" id="table-wrapper">
                <table>
                    <thead id="tableHead">
                    </thead>
                    <tbody id="resultBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="export-actions">
        <button class="btn-export-img" onclick="saveAsImage()">📱 이미지(PNG) 다운로드</button>
        <button class="btn-export-pdf" onclick="saveAsPDF()">🖨️ 인쇄용 PDF 다운로드 (A4)</button>
    </div>
</div>

<script>
    let reportData = [];
    let dataIdCounter = 0;

    function getTodayYYYYMMDD() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    window.onload = function() {
        document.getElementById('examDate').value = getTodayYYYYMMDD();
        renderTable();
    };

    // 고사실명 자연 정렬 (Natural Sort) 함수: 숫자가 포함된 문자열을 사람의 인식과 동일하게 정렬
    function naturalSort(a, b) {
        const ax = [], bx = [];
        a.room.replace(/(\d+)|(\D+)/g, function(_, $1, $2) { ax.push([$1 || Infinity, $2 || ""]) });
        b.room.replace(/(\d+)|(\D+)/g, function(_, $1, $2) { bx.push([$1 || Infinity, $2 || ""]) });
        
        while(ax.length && bx.length) {
            const an = ax.shift();
            const bn = bx.shift();
            const nn = (an[0] - bn[0]) || an[1].localeCompare(bn[1]);
            if (nn) return nn;
        }
        return ax.length - bx.length;
    }

    function calculateAndAdd(isTemplate = false, inputData = null) {
        // 단일 입력인지 엑셀(CSV)을 통한 대량 입력(배열)인지 확인
        const isBulk = Array.isArray(inputData);
        let entries = isBulk ? inputData : [inputData];
        
        if (!isBulk) {
            // 단일 폼 입력값 가져오기
            const agency = document.getElementById('agency').value.trim();
            const exam = document.getElementById('exam').value.trim();
            const room = document.getElementById('room').value.trim() || '-';
            const field = document.getElementById('field').value.trim() || '-';
            const period = document.getElementById('period').value; 
            const subject = document.getElementById('subject').value.trim() || '-';
            const totalInput = document.getElementById('total').value;
            const attendeesInput = document.getElementById('attendees').value;

            if (!agency || !exam) {
                alert("기관명과 시험명을 입력해주세요.");
                return;
            }
            if (isTemplate) {
                if (totalInput === '') {
                    alert("템플릿 생성을 위해 총 인원을 입력해주세요.");
                    return;
                }
            } else {
                if (totalInput === '' || attendeesInput === '') {
                    alert("총 인원과 응시인원을 모두 입력해주세요.");
                    return;
                }
            }

            entries = [{
                agency, exam, room, field, period, subject, totalInput, attendeesInput, isTemplate
            }];
        }

        // 공통 로직 처리 (다중 입력 지원)
        entries.forEach(entry => {
            const total = parseInt(entry.totalInput) || 0;
            let attendees = null;
            let absentees = null;

            if (!entry.isTemplate) {
                attendees = parseInt(entry.attendeesInput) || 0;
                if (attendees > total) {
                    if(!isBulk) alert("입력 오류: 응시인원이 총 인원보다 많을 수 없습니다.");
                    return; // 해당 항목 건너뜀
                }
                absentees = total - attendees;
            }

            if(!isBulk) updateReportTitleAndDate(entry.agency, entry.exam);

            let existingItem = reportData.find(item => item.room === entry.room && item.field === entry.field);

            if (existingItem) {
                existingItem.total = total; 
                existingItem.periods[entry.period] = {
                    subject: entry.subject,
                    attendees: attendees,
                    absentees: absentees,
                    isTemplate: entry.isTemplate
                };
            } else {
                let newItem = {
                    id: dataIdCounter++, 
                    room: entry.room,
                    field: entry.field,
                    total: total,
                    periods: {}
                };
                newItem.periods[entry.period] = {
                    subject: entry.subject,
                    attendees: attendees,
                    absentees: absentees,
                    isTemplate: entry.isTemplate
                };
                reportData.push(newItem);
            }
        });

        // ★ 배열 정렬 로직 추가: 고사실명을 기준으로 오름차순 정렬 수행
        reportData.sort(naturalSort);

        renderTable();
        
        if(!isBulk) {
            document.getElementById('attendees').select();
        }
    }

    // -------------------------------------------------------------
    // [새 기능] 엑셀(CSV) 양식 다운로드 및 업로드 처리
    // -------------------------------------------------------------
    function downloadCSVTemplate() {
        // 엑셀에서 쉽게 열리도록 인코딩과 헤더를 설정합니다. (BOM 추가)
        const BOM = "\uFEFF";
        let csvContent = "고사실(필수),지원분야,교시(필수),과목,총인원(필수),응시인원(필수),템플릿여부(O/X)\n";
        
        // 예시 데이터 2줄 추가
        csvContent += "1고사실,일반직,1교시,인성검사,50,45,X\n";
        csvContent += "2고사실,일반직,1교시,인성검사,50,,O\n";
        
        const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "응시율_입력양식.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function triggerExcelUpload() {
        const agency = document.getElementById('agency').value.trim();
        const exam = document.getElementById('exam').value.trim();
        
        if (!agency || !exam) {
            alert("엑셀 일괄 등록 전, 위 정보 입력 칸에 [기관명]과 [시험명]을 먼저 입력해주세요.");
            return;
        }
        document.getElementById('excel-input').click();
    }

    function loadFromCSV(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            // 줄바꿈으로 분리 후 빈 줄 제거
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            
            if (lines.length < 2) {
                alert("데이터가 없거나 잘못된 파일입니다.");
                return;
            }

            const agency = document.getElementById('agency').value.trim();
            const exam = document.getElementById('exam').value.trim();
            updateReportTitleAndDate(agency, exam);

            const parsedData = [];
            // 첫 줄(헤더) 제외하고 반복문 실행
            for (let i = 1; i < lines.length; i++) {
                // 쉼표로 분리하되 엑셀 특성 고려하여 단순 분리 사용
                const cols = lines[i].split(',');
                
                if (cols.length >= 6) {
                    const room = cols[0].trim();
                    if (!room) continue; // 고사실이 없으면 무시
                    
                    const field = cols[1].trim() || '-';
                    const period = cols[2].trim() || '1교시';
                    const subject = cols[3] ? cols[3].trim() : '-';
                    const totalInput = cols[4] ? cols[4].trim() : '0';
                    const attendeesInput = cols[5] ? cols[5].trim() : '0';
                    
                    // 템플릿 여부 판단 (7번째 열에 O가 있거나, 응시인원이 비어있을 경우)
                    const templateMark = cols[6] ? cols[6].trim().toUpperCase() : '';
                    const isTemplate = (templateMark === 'O' || templateMark === '0' || !attendeesInput);

                    parsedData.push({
                        agency: agency,
                        exam: exam,
                        room: room,
                        field: field,
                        period: period,
                        subject: subject || '-',
                        totalInput: totalInput,
                        attendeesInput: attendeesInput,
                        isTemplate: isTemplate
                    });
                }
            }

            if (parsedData.length > 0) {
                // calculateAndAdd 함수를 일괄 처리 모드로 호출
                calculateAndAdd(false, parsedData);
                alert(`${parsedData.length}개의 데이터를 성공적으로 일괄 등록했습니다.\n표 하단 및 정렬 상태를 확인하세요.`);
            } else {
                alert("읽어들일 수 있는 유효한 데이터가 없습니다. 양식을 확인해주세요.");
            }
            
            // 동일 파일 연속 업로드를 위해 초기화
            event.target.value = '';
        };
        
        // 인코딩 문제 방지를 위해 EUC-KR(또는 UTF-8) 시도
        // 엑셀에서 CSV 저장 시 보통 ANSI(EUC-KR)로 저장되므로 이를 처리
        reader.readAsText(file, "euc-kr"); 
    }
    // -------------------------------------------------------------

    function updateReportTitleAndDate(agency, exam) {
        document.getElementById('report-title').innerText = `${agency} [${exam}]`;
        
        const dateInput = document.getElementById('examDate').value;
        if (dateInput) {
            const [year, month, day] = dateInput.split('-');
            const selectedDate = new Date(year, month - 1, day);
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dayOfWeek = days[selectedDate.getDay()];
            const dateStr = `${year}.${month}.${day}(${dayOfWeek})`;
            document.getElementById('report-subtitle').innerText = dateStr;
        } else {
            document.getElementById('report-subtitle').innerText = "데이터를 입력하면 날짜가 반영됩니다.";
        }
    }

    function deleteRow(id) {
        if (confirm("해당 고사실의 데이터를 전체 삭제하시겠습니까?")) {
            reportData = reportData.filter(item => item.id !== id);
            renderTable();
            
            if (reportData.length === 0) {
                 document.getElementById('report-title').innerText = "기관명 [시험명]";
                 document.getElementById('report-subtitle').innerText = "데이터를 입력하면 날짜가 반영됩니다.";
            }
        }
    }

    function renderTable() {
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('resultBody');
        
        let activePeriods = [];
        if (reportData.length === 0) {
            activePeriods = ['1교시'];
        } else {
            ['1교시', '2교시', '3교시'].forEach(p => {
                if (reportData.some(item => item.periods[p])) {
                    activePeriods.push(p);
                }
            });
        }

        let theadHtml = `
            <tr>
                <th rowspan="2">고사실</th>
                <th rowspan="2">지원분야</th>
                <th rowspan="2" class="border-left-strong">총 인원</th>
        `;
        
        activePeriods.forEach(p => {
            let subj = '';
            reportData.forEach(item => {
                if (item.periods[p] && item.periods[p].subject !== '-') {
                    subj = item.periods[p].subject;
                }
            });
            let thText = subj ? `${p}\n(${subj})` : p;
            theadHtml += `<th colspan="3" class="border-left-strong">${thText}</th>`;
        });
        
        theadHtml += `
                <th rowspan="2" class="action-col hide-on-capture border-left-strong">관리</th>
            </tr>
            <tr>
        `;
        
        activePeriods.forEach(p => {
            theadHtml += `
                <th class="border-left-strong">응시</th>
                <th>결시</th>
                <th>응시율</th>
            `;
        });
        theadHtml += `</tr>`;
        thead.innerHTML = theadHtml;

        tbody.innerHTML = '';
        if (reportData.length === 0) {
            const colCount = 4 + (activePeriods.length * 3); 
            tbody.innerHTML = `<tr><td colspan="${colCount}" class="placeholder-text">상단에 데이터를 입력하고 [데이터 추가 및 계산] 또는 [현장 수기용 템플릿 생성] 버튼을 눌러주세요.<br>엑셀 일괄 등록 기능을 이용하시면 더 빠르게 작업할 수 있습니다.</td></tr>`;
            return;
        }

        let sumTotal = 0;
        let sum = {};
        activePeriods.forEach(p => sum[p] = { attendees: 0, absentees: 0, count: 0, templateCount: 0 });

        reportData.forEach(item => {
            sumTotal += item.total;
            
            const row = document.createElement('tr');
            let html = `
                <td>${item.room}</td>
                <td>${item.field}</td>
                <td class="border-left-strong"><strong>${item.total}</strong></td>
            `;

            activePeriods.forEach(p => {
                if (item.periods[p]) {
                    if (item.periods[p].isTemplate) {
                        html += `
                            <td class="border-left-strong"></td>
                            <td class="absent-cell"></td>
                            <td class="rate-cell"></td>
                        `;
                        sum[p].templateCount++;
                    } else {
                        const att = item.periods[p].attendees;
                        const abs = item.periods[p].absentees;
                        const tot = att + abs;
                        const rate = tot > 0 ? (att / tot) * 100 : 0;
                        const rateFmt = rate % 1 === 0 ? rate.toFixed(0) : rate.toFixed(1);

                        sum[p].attendees += att;
                        sum[p].absentees += abs;
                        sum[p].count++;

                        html += `
                            <td class="border-left-strong">${att}</td>
                            <td class="absent-cell">${abs}</td>
                            <td class="rate-cell">${rateFmt}%</td>
                        `;
                    }
                } else {
                    html += `
                        <td class="border-left-strong">-</td>
                        <td class="absent-cell">-</td>
                        <td class="rate-cell">-</td>
                    `;
                }
            });

            html += `
                <td class="action-col hide-on-capture border-left-strong">
                    <button class="btn-delete" onclick="deleteRow(${item.id})">삭제</button>
                </td>
            `;
            row.innerHTML = html;
            tbody.appendChild(row);
        });

        const totalRow = document.createElement('tr');
        totalRow.className = 'total-row';
        let totalHtml = `
            <td colspan="2">합계 (전체)</td>
            <td class="border-left-strong">${sumTotal}</td>
        `;

        activePeriods.forEach(p => {
            if (sum[p].count > 0 || sum[p].templateCount > 0) {
                if (sum[p].count === 0 || sum[p].templateCount > 0) {
                     totalHtml += `
                        <td class="border-left-strong"></td>
                        <td class="absent-cell"></td>
                        <td class="rate-cell"></td>
                    `;
                } else {
                    const att = sum[p].attendees;
                    const abs = sum[p].absentees;
                    const tot = att + abs;
                    const rate = tot > 0 ? (att / tot) * 100 : 0;
                    const rateFmt = rate % 1 === 0 ? rate.toFixed(0) : rate.toFixed(1);

                    totalHtml += `
                        <td class="border-left-strong">${att}</td>
                        <td class="absent-cell">${abs}</td>
                        <td class="rate-cell">${rateFmt}%</td>
                    `;
                }
            } else {
                totalHtml += `
                    <td class="border-left-strong">-</td>
                    <td class="absent-cell">-</td>
                    <td class="rate-cell">-</td>
                `;
            }
        });

        totalHtml += `<td class="action-col hide-on-capture border-left-strong"></td>`;
        totalRow.innerHTML = totalHtml;
        tbody.appendChild(totalRow);
    }

    function resetData() {
        if (confirm("입력된 모든 데이터가 삭제됩니다. 초기화하시겠습니까?")) {
            reportData = [];
            
            document.getElementById('report-title').innerText = "기관명 [시험명]";
            document.getElementById('report-subtitle').innerText = "데이터를 입력하면 날짜가 반영됩니다.";
            
            document.getElementById('agency').value = '';
            document.getElementById('exam').value = '';
            document.getElementById('examDate').value = getTodayYYYYMMDD();
            document.getElementById('room').value = '';
            document.getElementById('field').value = '';
            document.getElementById('period').value = '1교시';
            document.getElementById('subject').value = '';
            document.getElementById('total').value = '';
            document.getElementById('attendees').value = '';
            
            renderTable();
        }
    }
    
    function saveDataToFile() {
        if (reportData.length === 0) {
            alert("저장할 데이터가 없습니다. 먼저 데이터를 추가해주세요.");
            return;
        }

        const agency = document.getElementById('agency').value.trim() || '기관명미상';
        const exam = document.getElementById('exam').value.trim() || '시험명미상';

        const saveData = {
            agency: document.getElementById('agency').value,
            exam: document.getElementById('exam').value,
            examDate: document.getElementById('examDate').value,
            room: document.getElementById('room').value,
            field: document.getElementById('field').value,
            subject: document.getElementById('subject').value,
            data: reportData,
            dataIdCounter: dataIdCounter
        };

        const dataStr = JSON.stringify(saveData, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.href = url;
        link.download = `${agency}_${exam}_응시데이터.json`;
        link.click();
        
        URL.revokeObjectURL(url);
    }

    function triggerLoadFile() {
        document.getElementById('file-input').click();
    }

    function loadDataFromFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const loadedData = JSON.parse(e.target.result);
                
                if (!loadedData.data || !Array.isArray(loadedData.data)) {
                    throw new Error("올바른 응시율 데이터 파일(.json)이 아닙니다.");
                }
                
                document.getElementById('agency').value = loadedData.agency || '';
                document.getElementById('exam').value = loadedData.exam || '';
                document.getElementById('examDate').value = loadedData.examDate || getTodayYYYYMMDD();
                document.getElementById('room').value = loadedData.room || '';
                document.getElementById('field').value = loadedData.field || '';
                document.getElementById('subject').value = loadedData.subject || '';
                
                reportData = loadedData.data;
                dataIdCounter = loadedData.dataIdCounter || reportData.length;
                
                const agencyName = loadedData.agency.trim() || '기관명';
                const examName = loadedData.exam.trim() || '시험명';
                updateReportTitleAndDate(agencyName, examName);
                
                // 불러올 때도 정렬 한번 수행
                reportData.sort(naturalSort);
                
                renderTable();
                
                alert("데이터를 성공적으로 불러왔습니다.");
            } catch (error) {
                alert("파일을 불러오는 중 오류가 발생했습니다.\n" + error.message);
            }
            
            event.target.value = '';
        };
        
        reader.readAsText(file);
    }

    function captureReportElement(callback) {
        const reportArea = document.getElementById('report-area');
        const hiddenElements = reportArea.querySelectorAll('.hide-on-capture');
        
        hiddenElements.forEach(el => el.style.display = 'none');

        html2canvas(reportArea, {
            backgroundColor: '#ffffff',
            scale: 2, 
            logging: false,
            useCORS: true 
        }).then(canvas => {
            hiddenElements.forEach(el => el.style.display = '');
            callback(canvas);
        }).catch(err => {
            hiddenElements.forEach(el => el.style.display = '');
            alert("이미지 처리 중 오류가 발생했습니다.");
            console.error(err);
        });
    }

    function saveAsImage() {
        if (reportData.length === 0) {
            alert("출력할 데이터가 없습니다. 먼저 데이터를 추가해주세요.");
            return;
        }

        const agency = document.getElementById('agency').value.trim() || '기관';
        const exam = document.getElementById('exam').value.trim() || '시험';

        captureReportElement(function(canvas) {
            const link = document.createElement('a');
            link.download = `${agency}_${exam}_응시현황.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function saveAsPDF() {
         if (reportData.length === 0) {
            alert("출력할 데이터가 없습니다. 먼저 데이터를 추가해주세요.");
            return;
        }

        const agency = document.getElementById('agency').value.trim() || '기관';
        const exam = document.getElementById('exam').value.trim() || '시험';

        captureReportElement(function(canvas) {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('l', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            const imgProps = pdf.getImageProperties(imgData);
            const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;
            
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
            pdf.save(`${agency}_${exam}_응시현황.pdf`);
        });
    }
</script>
