<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시험 응시율 계산 및 보고서 생성기</title>
    <!-- 세련된 폰트 (Pretendard) 적용 -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <!-- html2canvas 및 jsPDF 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Pretendard', 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 20px 10px;
            color: #334155;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .input-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .card-title {
            font-size: 1.2em;
            font-weight: 700;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 20px;
            background-color: #4f46e5;
            border-radius: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.85em;
            color: #64748b;
        }
        input, select {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95em;
            transition: all 0.2s ease;
            font-family: inherit;
            background-color: #f8fafc;
            color: #1e293b;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #4f46e5;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-actions {
            margin-top: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-direction: column;
        }
        @media (min-width: 600px) {
            .form-actions { flex-direction: row; }
        }
        .form-actions button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-add {
            background-color: #4f46e5;
            color: white;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }
        .btn-add:hover { background-color: #4338ca; transform: translateY(-2px); }
        
        .btn-template {
            background-color: #f59e0b;
            color: white;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.2);
        }
        .btn-template:hover { background-color: #d97706; transform: translateY(-2px); }

        .utility-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px dashed #cbd5e1;
            flex-wrap: wrap;
            gap: 10px;
        }
        .utility-actions-left, .utility-actions-right {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .utility-actions button {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.85em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        /* 기존 버튼 색상 유지 */
        .btn-save { background-color: #0d9488; color: white; }
        .btn-save:hover { background-color: #0f766e; }
        .btn-load { background-color: #0284c7; color: white; }
        .btn-load:hover { background-color: #0369a1; }
        .btn-reset { background-color: #f1f5f9; color: #475569; }
        .btn-reset:hover { background-color: #e2e8f0; color: #1e293b; }
        
        .m-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        .m-table th, .m-table td { border: 1px solid #e2e8f0; padding: 8px 6px; text-align: center; }
        .m-table th { background: #f1f5f9; color: #475569; }
        .m-input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; text-align: center; font-family: inherit; transition: border-color 0.2s; }
        .m-input:focus { outline: none; border-color: #4f46e5; }
        .m-input::placeholder { color: #cbd5e1; }

        .btn-add-row {
            background-color: #3b82f6; color: white; border: none; border-radius: 8px;
            padding: 10px 20px; cursor: pointer; font-weight: 600; font-size: 0.95em;
            transition: background-color 0.2s; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-add-row:hover { background-color: #2563eb; }

        .export-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-direction: column;
        }
        @media (min-width: 600px) {
            .export-actions { flex-direction: row; }
        }
        .export-actions button {
            flex: 1;
            font-size: 1em;
            padding: 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        
        .btn-export-img {
            background-color: #10b981;
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .btn-export-img:hover { background-color: #059669; transform: translateY(-2px); }

        .btn-export-pdf {
            background-color: #ef4444;
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }
        .btn-export-pdf:hover { background-color: #dc2626; transform: translateY(-2px); }
        
        /* 보고서 영역 래퍼 */
        .report-wrapper {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            margin: 0 auto;
        }

        .report-container {
            box-sizing: border-box; 
            padding: 40px;
            width: 1122px; /* A4 가로 비율 */
            min-width: 1122px; 
            background: #ffffff; 
        }

        .report-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            gap: 12px; 
        }
        .report-header-left { width: 100%; }
        .report-header-left h2 {
            margin: 0;
            color: #0f172a;
            font-size: 1.8em;
            font-weight: 800;
            letter-spacing: -0.5px;
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .report-header-right {
            width: 100%;
            text-align: right;
        }
        .report-header-right .subtitle {
            color: #64748b;
            font-size: 1.05em;
            font-weight: 500;
        }
        
        .table-responsive {
            width: 100%;
            overflow: visible; 
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
            max-width: 100%;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px 6px; 
            text-align: center;
            vertical-align: middle;
            white-space: nowrap; 
        }
        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 700;
            white-space: pre-wrap; 
            line-height: 1.4;
        }
        th.border-left-strong, td.border-left-strong {
            border-left: 2px solid #cbd5e1;
        }
        tbody tr { transition: background-color 0.15s ease; }
        tbody tr:hover { background-color: #f8fafc; }
        .rate-cell { font-weight: 700; color: #4f46e5; }
        .absent-cell { color: #94a3b8; }
        .total-row {
            background-color: #f1f5f9 !important;
            font-weight: 700;
            color: #0f172a;
        }
        .total-row td { border-top: 2px solid #cbd5e1; }
        .total-row .rate-cell { color: #ea580c; }
        
        .placeholder-text {
            text-align: center;
            color: #94a3b8;
            padding: 60px 0;
            font-weight: 500;
            white-space: normal;
        }

        .btn-delete-row {
            padding: 6px 12px;
            background-color: #fef2f2;
            color: #ef4444;
            border: 1px solid #fecaca;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete-row:hover {
            background-color: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 시험 기본 정보 영역 -->
    <div class="input-card">
        <div class="card-title">1. 시험 기본 정보</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="agency">기관명</label>
                <input type="text" id="agency" placeholder="예: OO기관" value="">
            </div>
            <div class="form-group">
                <label for="exam">시험명</label>
                <input type="text" id="exam" placeholder="예: 필기전형" value="">
            </div>
            <div class="form-group">
                <label for="examDate">전형(시험)일</label>
                <input type="date" id="examDate">
            </div>
            <div class="form-group">
                <label for="period">교시</label>
                <select id="period">
                    <option value="1교시">1교시</option>
                    <option value="2교시">2교시</option>
                    <option value="3교시">3교시</option>
                </select>
            </div>
            <div class="form-group">
                <label for="subject">과목</label>
                <input type="text" id="subject" placeholder="예: 인성검사">
            </div>
        </div>
        <div class="form-actions" style="margin-top: 10px; margin-bottom: 0;">
            <button class="btn-save" style="background-color: #64748b;" onclick="updateBasicInfo()">✅ 기본 정보 표에 반영</button>
        </div>
    </div>

    <!-- 2. 시험 데이터 입력 (그리드) 영역 -->
    <div class="input-card">
        <div class="card-title">2. 시험 데이터 입력 (그리드)</div>
        
        <div class="table-responsive" style="overflow: visible;">
            <table class="m-table" id="inputGrid" style="margin-bottom: 15px;">
                <thead>
                    <tr>
                        <th style="width: 14%;">고사실</th>
                        <th style="width: 12%;">지원분야</th>
                        <th style="width: 12%;">총 인원</th>
                        <th id="grid-th-1" style="width: 15%; white-space: pre-wrap;">1교시(응시)</th>
                        <th id="grid-th-2" style="width: 15%; white-space: pre-wrap;">2교시(응시)</th>
                        <th id="grid-th-3" style="width: 15%; white-space: pre-wrap;">3교시(응시)</th>
                        <th style="width: 10%;">관리</th>
                    </tr>
                </thead>
                <tbody id="manageTbody">
                </tbody>
            </table>
        </div>
        
        <div style="text-align: center; margin-bottom: 25px;">
            <button class="btn-add-row" onclick="addEmptyRow()">➕ 빈 행 추가하여 계속 입력하기</button>
        </div>
        
        <div class="form-actions">
            <button class="btn-add" onclick="applyGridData(false)">✅ 작성한 데이터 표에 반영 및 계산</button>
            <button class="btn-template" onclick="applyGridData(true)">📄 현장 수기용 템플릿(빈칸) 일괄 생성</button>
        </div>
        
        <div class="utility-actions">
            <div class="utility-actions-left">
                <button class="btn-save" onclick="saveDataToFile()">💾 백업용 파일 저장</button>
                <button class="btn-load" onclick="triggerLoadFile()">📂 파일 불러오기</button>
            </div>
            <div class="utility-actions-right">
                <button class="btn-reset" onclick="resetData()">🗑️ 전체 초기화</button>
            </div>
        </div>
        
        <input type="file" id="file-input" accept=".json" style="display: none;" onchange="loadDataFromFile(event)">
    </div>

    <!-- 캡처 대상 컨테이너 래퍼 (스크롤 영역) -->
    <div class="report-wrapper">
        <!-- 실제 캡처될 고정 크기 컨테이너 -->
        <div id="report-area" class="report-container">
            <div class="report-header">
                <div class="report-header-left">
                    <h2 id="report-title">기관명 [시험명]</h2>
                </div>
                <div class="report-header-right">
                    <span class="subtitle" id="report-subtitle">데이터를 입력하면 날짜가 반영됩니다.</span>
                </div>
            </div>
            
            <div class="table-responsive" id="table-wrapper">
                <table>
                    <thead id="tableHead">
                    </thead>
                    <tbody id="resultBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="export-actions">
        <button class="btn-export-img" onclick="saveAsImage()">📱 이미지(PNG) 다운로드</button>
        <button class="btn-export-pdf" onclick="saveAsPDF()">🖨️ 인쇄용 PDF 다운로드 (A4)</button>
    </div>
</div>

<script>
    let reportData = [];
    let dataIdCounter = 0;
    let globalSubjects = { '1교시': '-', '2교시': '-', '3교시': '-' };

    function getTodayYYYYMMDD() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    window.onload = function() {
        document.getElementById('examDate').value = getTodayYYYYMMDD();
        renderGrid();
        renderTable();
    };

    // 교시 선택 시 해당 교시의 저장된 과목명을 불러오기
    document.getElementById('period').addEventListener('change', function(e) {
        const p = e.target.value;
        document.getElementById('subject').value = globalSubjects[p] !== '-' ? globalSubjects[p] : '';
    });

    // 고사실명 자연 정렬 (Natural Sort) 함수: 숫자가 포함된 문자열을 사람의 인식과 동일하게 정렬
    function naturalSort(a, b) {
        const ax = [], bx = [];
        a.room.replace(/(\d+)|(\D+)/g, function(_, $1, $2) { ax.push([$1 || Infinity, $2 || ""]) });
        b.room.replace(/(\d+)|(\D+)/g, function(_, $1, $2) { bx.push([$1 || Infinity, $2 || ""]) });
        
        while(ax.length && bx.length) {
            const an = ax.shift();
            const bn = bx.shift();
            const nn = (an[0] - bn[0]) || an[1].localeCompare(bn[1]);
            if (nn) return nn;
        }
        return ax.length - bx.length;
    }

    function updateBasicInfo() {
        const agency = document.getElementById('agency').value.trim();
        const exam = document.getElementById('exam').value.trim();
        const p = document.getElementById('period').value;
        const subj = document.getElementById('subject').value.trim() || '-';
        
        if (!agency || !exam) {
            alert("기관명과 시험명을 입력해주세요.");
            return;
        }

        globalSubjects[p] = subj;
        updateReportTitleAndDate(agency, exam);
        
        // 그리드 헤더 업데이트
        ['1교시', '2교시', '3교시'].forEach(period => {
            const th = document.getElementById(`grid-th-${period.charAt(0)}`);
            if (th) {
                th.innerText = globalSubjects[period] !== '-' ? `${period}\n(${globalSubjects[period]})` : `${period}(응시)`;
            }
        });

        renderTable();
        alert(`${p} 과목명(${subj !== '-' ? subj : '미지정'}) 및 기본 정보가 반영되었습니다.`);
    }

    function createGridRowHtml(item) {
        let isNew = !item;
        let id = isNew ? `temp-${Date.now()}` : item.id;
        let room = isNew ? '' : item.room;
        let field = isNew ? '일반직' : item.field;
        let total = isNew ? '' : item.total;
        
        let html = `<tr data-id="${id}">
            <td><input type="text" class="m-input m-room" value="${room}" placeholder="고사실"></td>
            <td><input type="text" class="m-input m-field" value="${field}" placeholder="분야"></td>
            <td><input type="number" class="m-input m-tot" value="${total}" min="0" placeholder="총인원"></td>
        `;
        
        ['1교시', '2교시', '3교시'].forEach(p => {
            const pData = isNew ? null : item.periods[p];
            const att = (pData && !pData.isTemplate) ? pData.attendees : '';
            const isTpl = (pData && pData.isTemplate) ? 'true' : 'false';
            const placeholder = (pData && pData.isTemplate) ? '템플릿(빈칸)' : '응시인원';
            
            html += `<td><input type="number" class="m-input m-att-${p}" value="${att}" data-template="${isTpl}" min="0" placeholder="${placeholder}"></td>`;
        });
        
        html += `
            <td>
                <button class="btn-delete-row" onclick="this.closest('tr').remove()">삭제</button>
            </td>
        </tr>`;
        return html;
    }

    function renderGrid() {
        const tbody = document.getElementById('manageTbody');
        let html = '';
        if (reportData.length === 0) {
            html = createGridRowHtml(null); // 기본 빈 행 1개 생성
        } else {
            reportData.forEach(item => {
                html += createGridRowHtml(item);
            });
        }
        tbody.innerHTML = html;

        ['1교시', '2교시', '3교시'].forEach(period => {
            const th = document.getElementById(`grid-th-${period.charAt(0)}`);
            if (th) {
                th.innerText = globalSubjects[period] !== '-' ? `${period}\n(${globalSubjects[period]})` : `${period}(응시)`;
            }
        });
    }

    function addEmptyRow() {
        const tbody = document.getElementById('manageTbody');
        tbody.insertAdjacentHTML('beforeend', createGridRowHtml(null));
    }

    function applyGridData(isTemplate) {
        const newReportData = [];
        const rows = document.querySelectorAll('#manageTbody tr');
        let hasError = false;

        // 템플릿 생성 시 활성화할 교시 판단 (기본 정보에서 과목명이 설정된 교시)
        let activeForTemplate = ['1교시'];
        if (globalSubjects['1교시'] !== '-' || globalSubjects['2교시'] !== '-' || globalSubjects['3교시'] !== '-') {
             activeForTemplate = ['1교시', '2교시', '3교시'].filter(p => globalSubjects[p] !== '-');
        }

        rows.forEach(tr => {
            const idAttr = tr.getAttribute('data-id');
            const room = tr.querySelector('.m-room').value.trim();
            const field = tr.querySelector('.m-field').value.trim() || '일반직';
            const totalVal = tr.querySelector('.m-tot').value;
            
            if(!room) return; // 고사실 입력이 없으면 무시
            
            const total = parseInt(totalVal) || 0;
            let periods = {};
            
            ['1교시', '2교시', '3교시'].forEach(p => {
                const attInput = tr.querySelector(`.m-att-${p}`);
                const isTemplateAttr = attInput.getAttribute('data-template') === 'true';
                const val = attInput.value.trim();
                const subj = globalSubjects[p]; // 전역 과목명 적용

                if (isTemplate) {
                    if (activeForTemplate.includes(p)) {
                        periods[p] = { subject: subj, attendees: null, absentees: null, isTemplate: true };
                        attInput.value = '';
                        attInput.setAttribute('data-template', 'true');
                        attInput.placeholder = '템플릿(빈칸)';
                    }
                } else {
                    if (val !== '') {
                        const att = parseInt(val) || 0;
                        if (att > total) hasError = true;
                        
                        periods[p] = {
                            subject: subj,
                            attendees: Math.min(att, total), // 총인원 초과 방지
                            absentees: total - Math.min(att, total),
                            isTemplate: false
                        };
                        attInput.setAttribute('data-template', 'false');
                        attInput.placeholder = '응시인원';
                    } else if (isTemplateAttr) {
                        periods[p] = { subject: subj, attendees: null, absentees: null, isTemplate: true };
                    }
                }
            });
            
            newReportData.push({
                id: idAttr.startsWith('temp') ? dataIdCounter++ : idAttr,
                room: room,
                field: field,
                total: total,
                periods: periods
            });
        });
        
        if (newReportData.length === 0) {
            alert("입력된 고사실 데이터가 없습니다.");
            return;
        }

        if(hasError) alert("일부 응시인원이 총 인원을 초과하여, 자동으로 총 인원에 맞춰 조정되었습니다.");

        reportData = newReportData;
        reportData.sort(naturalSort); // 정렬
        
        renderGrid(); // 값 조정(초과 인원 등) 후 그리드 재렌더링
        renderTable(); // 하단 표 업데이트
    }

    function updateReportTitleAndDate(agency, exam) {
        document.getElementById('report-title').innerText = `${agency} [${exam}]`;
        
        const dateInput = document.getElementById('examDate').value;
        if (dateInput) {
            const [year, month, day] = dateInput.split('-');
            const selectedDate = new Date(year, month - 1, day);
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dayOfWeek = days[selectedDate.getDay()];
            const dateStr = `${year}.${month}.${day}(${dayOfWeek})`;
            document.getElementById('report-subtitle').innerText = dateStr;
        } else {
            document.getElementById('report-subtitle').innerText = "데이터를 입력하면 날짜가 반영됩니다.";
        }
    }

    function deleteRow(id) {
        if (confirm("해당 고사실의 데이터를 전체 삭제하시겠습니까?")) {
            reportData = reportData.filter(item => item.id !== id);
            renderTable();
            
            if (reportData.length === 0) {
                 document.getElementById('report-title').innerText = "기관명 [시험명]";
                 document.getElementById('report-subtitle').innerText = "데이터를 입력하면 날짜가 반영됩니다.";
            }
        }
    }

    function renderTable() {
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('resultBody');
        
        let activePeriods = [];
        if (reportData.length === 0) {
            activePeriods = ['1교시'];
        } else {
            ['1교시', '2교시', '3교시'].forEach(p => {
                // 데이터가 있거나 전역 과목명이 지정된 교시를 활성화
                if (reportData.some(item => item.periods[p]) || globalSubjects[p] !== '-') {
                    activePeriods.push(p);
                }
            });
            if(activePeriods.length === 0) activePeriods = ['1교시'];
        }

        let theadHtml = `
            <tr>
                <th rowspan="2">고사실</th>
                <th rowspan="2">지원분야</th>
                <th rowspan="2" class="border-left-strong">총 인원</th>
        `;
        
        activePeriods.forEach(p => {
            // 전역 변수 우선 적용, 없으면 데이터에서 추출
            let subj = globalSubjects[p] !== '-' ? globalSubjects[p] : '';
            if (!subj) {
                let found = reportData.find(item => item.periods[p] && item.periods[p].subject !== '-');
                if(found) subj = found.periods[p].subject;
            }
            let thText = subj ? `${p}\n(${subj})` : p;
            theadHtml += `<th colspan="3" class="border-left-strong">${thText}</th>`;
        });
        
        theadHtml += `
            </tr>
            <tr>
        `;
        
        activePeriods.forEach(p => {
            theadHtml += `
                <th class="border-left-strong">응시</th>
                <th>결시</th>
                <th>응시율</th>
            `;
        });
        theadHtml += `</tr>`;
        thead.innerHTML = theadHtml;

        tbody.innerHTML = '';
        if (reportData.length === 0) {
            const colCount = 3 + (activePeriods.length * 3); 
            tbody.innerHTML = `<tr><td colspan="${colCount}" class="placeholder-text">상단 데이터 입력 그리드에서 데이터를 작성하고 [✅ 반영] 버튼을 눌러주세요.</td></tr>`;
            return;
        }

        let sumTotal = 0;
        let sum = {};
        activePeriods.forEach(p => sum[p] = { attendees: 0, absentees: 0, count: 0, templateCount: 0 });

        // 고사실 병합(rowspan)을 위한 카운트 계산
        let spanCounts = {};
        let currentRoom = null;
        let startIdx = 0;
        for(let i = 0; i < reportData.length; i++) {
            if (i === 0) {
                currentRoom = reportData[i].room;
                startIdx = i;
                spanCounts[startIdx] = 1;
            } else {
                if (reportData[i].room === currentRoom) {
                    spanCounts[startIdx]++;
                } else {
                    currentRoom = reportData[i].room;
                    startIdx = i;
                    spanCounts[startIdx] = 1;
                }
            }
        }

        reportData.forEach((item, index) => {
            sumTotal += item.total;
            
            const row = document.createElement('tr');
            let html = '';
            
            // 병합 대상인 경우 rowspan 속성 추가, 중복 행은 생성하지 않음
            if (spanCounts[index]) {
                html += `<td rowspan="${spanCounts[index]}">${item.room}</td>`;
            }
            
            html += `
                <td>${item.field}</td>
                <td class="border-left-strong"><strong>${item.total}</strong></td>
            `;

            activePeriods.forEach(p => {
                if (item.periods[p]) {
                    if (item.periods[p].isTemplate) {
                        html += `
                            <td class="border-left-strong"></td>
                            <td class="absent-cell"></td>
                            <td class="rate-cell"></td>
                        `;
                        sum[p].templateCount++;
                    } else {
                        const att = item.periods[p].attendees;
                        const abs = item.periods[p].absentees;
                        const tot = att + abs;
                        const rate = tot > 0 ? (att / tot) * 100 : 0;
                        const rateFmt = rate % 1 === 0 ? rate.toFixed(0) : rate.toFixed(1);

                        sum[p].attendees += att;
                        sum[p].absentees += abs;
                        sum[p].count++;

                        html += `
                            <td class="border-left-strong">${att}</td>
                            <td class="absent-cell">${abs}</td>
                            <td class="rate-cell">${rateFmt}%</td>
                        `;
                    }
                } else {
                    html += `
                        <td class="border-left-strong">-</td>
                        <td class="absent-cell">-</td>
                        <td class="rate-cell">-</td>
                    `;
                }
            });

            html += `
                <td class="action-col hide-on-capture border-left-strong">
                    <button class="btn-delete" onclick="deleteRow(${item.id})">삭제</button>
                </td>
            `;
            row.innerHTML = html;
            tbody.appendChild(row);
        });

        const totalRow = document.createElement('tr');
        totalRow.className = 'total-row';
        let totalHtml = `
            <td colspan="2">합계 (전체)</td>
            <td class="border-left-strong">${sumTotal}</td>
        `;

        activePeriods.forEach(p => {
            if (sum[p].count > 0 || sum[p].templateCount > 0) {
                if (sum[p].count === 0 || sum[p].templateCount > 0) {
                     totalHtml += `
                        <td class="border-left-strong"></td>
                        <td class="absent-cell"></td>
                        <td class="rate-cell"></td>
                    `;
                } else {
                    const att = sum[p].attendees;
                    const abs = sum[p].absentees;
                    const tot = att + abs;
                    const rate = tot > 0 ? (att / tot) * 100 : 0;
                    const rateFmt = rate % 1 === 0 ? rate.toFixed(0) : rate.toFixed(1);

                    totalHtml += `
                        <td class="border-left-strong">${att}</td>
                        <td class="absent-cell">${abs}</td>
                        <td class="rate-cell">${rateFmt}%</td>
                    `;
                }
            } else {
                totalHtml += `
                    <td class="border-left-strong">-</td>
                    <td class="absent-cell">-</td>
                    <td class="rate-cell">-</td>
                `;
            }
        });

        totalHtml += `<td class="action-col hide-on-capture border-left-strong"></td>`;
        totalRow.innerHTML = totalHtml;
        tbody.appendChild(totalRow);
    }

    function resetData() {
        if (confirm("입력된 모든 데이터가 삭제됩니다. 초기화하시겠습니까?")) {
            reportData = [];
            globalSubjects = { '1교시': '-', '2교시': '-', '3교시': '-' };
            
            document.getElementById('report-title').innerText = "기관명 [시험명]";
            document.getElementById('report-subtitle').innerText = "데이터를 입력하면 날짜가 반영됩니다.";
            
            document.getElementById('agency').value = '';
            document.getElementById('exam').value = '';
            document.getElementById('examDate').value = getTodayYYYYMMDD();
            document.getElementById('period').value = '1교시';
            document.getElementById('subject').value = '';
            
            renderGrid();
            renderTable();
        }
    }
    
    function saveDataToFile() {
        if (reportData.length === 0) {
            alert("저장할 데이터가 없습니다. 먼저 데이터를 추가해주세요.");
            return;
        }

        const agency = document.getElementById('agency').value.trim() || '기관명미상';
        const exam = document.getElementById('exam').value.trim() || '시험명미상';

        const saveData = {
            agency: document.getElementById('agency').value,
            exam: document.getElementById('exam').value,
            examDate: document.getElementById('examDate').value,
            globalSubjects: globalSubjects,
            data: reportData,
            dataIdCounter: dataIdCounter
        };

        const dataStr = JSON.stringify(saveData, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.href = url;
        link.download = `${agency}_${exam}_응시데이터.json`;
        link.click();
        
        URL.revokeObjectURL(url);
    }

    function triggerLoadFile() {
        document.getElementById('file-input').click();
    }

    function loadDataFromFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const loadedData = JSON.parse(e.target.result);
                
                if (!loadedData.data || !Array.isArray(loadedData.data)) {
                    throw new Error("올바른 응시율 데이터 파일(.json)이 아닙니다.");
                }
                
                document.getElementById('agency').value = loadedData.agency || '';
                document.getElementById('exam').value = loadedData.exam || '';
                document.getElementById('examDate').value = loadedData.examDate || getTodayYYYYMMDD();
                
                if (loadedData.globalSubjects) {
                    globalSubjects = loadedData.globalSubjects;
                } else {
                    globalSubjects = { '1교시': '-', '2교시': '-', '3교시': '-' };
                }
                
                document.getElementById('period').value = '1교시';
                document.getElementById('subject').value = globalSubjects['1교시'] !== '-' ? globalSubjects['1교시'] : '';
                
                reportData = loadedData.data;
                dataIdCounter = loadedData.dataIdCounter || reportData.length;
                
                const agencyName = loadedData.agency.trim() || '기관명';
                const examName = loadedData.exam.trim() || '시험명';
                updateReportTitleAndDate(agencyName, examName);
                
                reportData.sort(naturalSort);
                
                renderGrid();
                renderTable();
                
                alert("데이터를 성공적으로 불러왔습니다.");
            } catch (error) {
                alert("파일을 불러오는 중 오류가 발생했습니다.\n" + error.message);
            }
            
            event.target.value = '';
        };
        
        reader.readAsText(file);
    }

    function captureReportElement(callback) {
        const reportArea = document.getElementById('report-area');
        const hiddenElements = reportArea.querySelectorAll('.hide-on-capture');
        
        hiddenElements.forEach(el => el.style.display = 'none');

        html2canvas(reportArea, {
            backgroundColor: '#ffffff',
            scale: 2, 
            logging: false,
            useCORS: true 
        }).then(canvas => {
            hiddenElements.forEach(el => el.style.display = '');
            callback(canvas);
        }).catch(err => {
            hiddenElements.forEach(el => el.style.display = '');
            alert("이미지 처리 중 오류가 발생했습니다.");
            console.error(err);
        });
    }

    function saveAsImage() {
        if (reportData.length === 0) {
            alert("출력할 데이터가 없습니다. 먼저 데이터를 추가해주세요.");
            return;
        }

        const agency = document.getElementById('agency').value.trim() || '기관';
        const exam = document.getElementById('exam').value.trim() || '시험';

        captureReportElement(function(canvas) {
            const link = document.createElement('a');
            link.download = `${agency}_${exam}_응시현황.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function saveAsPDF() {
         if (reportData.length === 0) {
            alert("출력할 데이터가 없습니다. 먼저 데이터를 추가해주세요.");
            return;
        }

        const agency = document.getElementById('agency').value.trim() || '기관';
        const exam = document.getElementById('exam').value.trim() || '시험';

        captureReportElement(function(canvas) {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('l', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            const imgProps = pdf.getImageProperties(imgData);
            const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;
            
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
            pdf.save(`${agency}_${exam}_응시현황.pdf`);
        });
    }

    // =======================================================
    // --- 새로 추가된 데이터 일괄 관리 및 수정 기능 (모달) ---
    // =======================================================
    function openManageModal() {
        const tbody = document.getElementById('manageTbody');
        let html = '';
        reportData.forEach((item) => {
            html += createModalRowHtml(item);
        });
        tbody.innerHTML = html;
        document.getElementById('manageModal').style.display = 'flex';
    }

    function createModalRowHtml(item) {
        let isNew = !item;
        let id = isNew ? `temp-${Date.now()}` : item.id;
        let room = isNew ? '' : item.room;
        let field = isNew ? '일반직' : item.field;
        let total = isNew ? '' : item.total;
        
        let html = `<tr data-id="${id}">
            <td><input type="text" class="m-input m-room" value="${room}" style="width: 90px;" placeholder="고사실"></td>
            <td><input type="text" class="m-input m-field" value="${field}" style="width: 80px;" placeholder="분야"></td>
            <td><input type="number" class="m-input m-tot" value="${total}" style="width: 70px;" placeholder="총인원"></td>
        `;
        
        ['1교시', '2교시', '3교시'].forEach(p => {
            const pData = isNew ? null : item.periods[p];
            const att = (pData && !pData.isTemplate) ? pData.attendees : '';
            const isTpl = (pData && pData.isTemplate) ? 'true' : 'false';
            const placeholder = (pData && pData.isTemplate) ? '템플릿' : '응시(공백시 제외)';
            
            html += `<td><input type="number" class="m-input m-att-${p}" value="${att}" data-template="${isTpl}" style="width: 80px;" placeholder="${placeholder}"></td>`;
        });
        
        html += `
            <td>
                <button class="btn-delete" style="padding: 6px 10px;" onclick="this.closest('tr').remove()">삭제</button>
            </td>
        </tr>`;
        return html;
    }

    function addEmptyRowInModal() {
        const tbody = document.getElementById('manageTbody');
        tbody.insertAdjacentHTML('beforeend', createModalRowHtml(null));
        
        // 추가 후 모달 스크롤 맨 아래로 이동
        const modalBody = document.querySelector('.modal-body');
        modalBody.scrollTop = modalBody.scrollHeight;
    }

    function closeManageModal() {
        document.getElementById('manageModal').style.display = 'none';
    }

    function saveManagedData() {
        const newReportData = [];
        const rows = document.querySelectorAll('#manageTbody tr');
        
        rows.forEach(tr => {
            const idAttr = tr.getAttribute('data-id');
            const room = tr.querySelector('.m-room').value.trim();
            const field = tr.querySelector('.m-field').value.trim() || '-';
            const totalVal = tr.querySelector('.m-tot').value;
            
            if(!room) return; // 고사실 이름이 없으면 저장 안함
            
            const total = parseInt(totalVal) || 0;
            let periods = {};
            
            // 기존 데이터 찾기
            let existingItem = reportData.find(item => item.id == idAttr);
            
            ['1교시', '2교시', '3교시'].forEach(p => {
                const attInput = tr.querySelector(`.m-att-${p}`);
                const isTemplateAttr = attInput.getAttribute('data-template') === 'true';
                const val = attInput.value.trim();
                
                // 과목명 찾기 (기존 데이터 -> 전역 데이터 -> '-')
                let subject = '-';
                if (existingItem && existingItem.periods[p]) {
                    subject = existingItem.periods[p].subject;
                } else {
                    let ref = reportData.find(r => r.periods[p] && r.periods[p].subject !== '-');
                    if (ref) subject = ref.periods[p].subject;
                }

                if (val !== '') {
                    const att = parseInt(val) || 0;
                    periods[p] = {
                        subject: subject,
                        attendees: Math.min(att, total), // 총 인원을 넘지 않게 방어
                        absentees: total - Math.min(att, total),
                        isTemplate: false
                    };
                } else if (isTemplateAttr) {
                    periods[p] = {
                        subject: subject,
                        attendees: null,
                        absentees: null,
                        isTemplate: true
                    };
                }
            });
            
            newReportData.push({
                id: existingItem ? existingItem.id : dataIdCounter++,
                room: room,
                field: field,
                total: total,
                periods: periods
            });
        });
        
        reportData = newReportData;
        reportData.sort(naturalSort); // 변경된 고사실명 기준으로 재정렬
        renderTable();
        closeManageModal();
    }
</script>
